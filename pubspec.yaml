name: finance_tracking_app
description: "Personal finance tracking mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  shadcn_ui: ^0.46.1
  shimmer: ^3.0.0                # loading skeleton

  # Charts
  fl_chart: ^0.69.0

  # HTTP & Networking
  dio: ^5.4.0                    # HTTP client utama
  pretty_dio_logger: ^1.3.1      # log request/response di dev

  # State Management
  flutter_riverpod: ^2.5.1       # state management
  riverpod_annotation: ^2.3.3    # code generation untuk riverpod

  # Serialization
  freezed_annotation: ^2.4.1     # immutable models
  json_annotation: ^4.8.1        # json serialization

  # Local Storage
  flutter_secure_storage: ^9.0.0 # simpan token/base URL
  shared_preferences: ^2.2.2     # simpan preferensi user

  # Navigation
  go_router: ^13.2.0             # declarative routing

  # Utilities
  intl: ^0.20.2                  # format tanggal & currency (IDR)
  uuid: ^4.5.1                   # generate UUID client-side
  equatable: ^2.0.5              # value equality
  dartz: ^0.10.1                 # functional: Either<Failure, T>

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.7

flutter:

  uses-material-design: true

